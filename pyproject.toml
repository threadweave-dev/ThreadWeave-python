[build-system]
requires = ["hatchling>=1.27.0"]
build-backend = "hatchling.build"

[project]
name = "threadweave-python"
version = "0.1.0"
description = "Python SDK for the ThreadWeave distributed execution platform."
readme = "README.md"
requires-python = ">=3.11"
license = "Apache-2.0"
license-files = ["LICENSE"]

authors = [
    { name = "ThreadWeave Contributors" }
]

keywords = [
    "threadweave",
    "distributed",
    "tasks",
    "queue",
    "scheduler",
    "async",
    "worker",
]

classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Typing :: Typed",
]

dependencies = [
    "threadweave-protocols-grpc-python",
]

[[tool.uv.index]]
name = "buf"
url = "https://buf.build/gen/python"


[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "pytest-cov>=6.0",
    "ruff>=0.7",
    "mypy>=1.13",
]

docs = [
    "mkdocs-material>=9.6",
]

[project.urls]
Homepage = "https://github.com/threadweave-dev/threadweave-python"
Repository = "https://github.com/threadweave-dev/threadweave-python"
Issues = "https://github.com/threadweave-dev/threadweave-python/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/threadweave"]

[tool.hatch.build.targets.sdist]
include = [
    "/LICENSE",
    "/README.md",
    "/pyproject.toml",
    "/src",
]

[tool.pytest.ini_options]
testpaths = [
    "tests",
]
asyncio_mode = "auto"

[tool.ruff]
target-version = "py311"
line-length = 88

[tool.ruff.lint]
select = [
    "E",
    "F",
    "I",
    "B",
    "UP",
]

[tool.mypy]
python_version = "3.11"
strict = true
warn_unused_configs = true
warn_return_any = true
warn_unused_ignores = true
disallow_untyped_defs = true
no_implicit_optional = true

[tool.coverage.run]
branch = true
source = [
    "threadweave",
]

[tool.coverage.report]
show_missing = true
skip_covered = true
